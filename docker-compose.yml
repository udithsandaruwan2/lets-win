services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: letswin
      POSTGRES_USER: letswin
      POSTGRES_PASSWORD: letswin
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letswin -d letswin"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lets_win_pg:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: docker-dev-only-change-me
      POSTGRES_DB: letswin
      POSTGRES_USER: letswin
      POSTGRES_PASSWORD: letswin
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SUPERUSER_USERNAME: operator
      DJANGO_SUPERUSER_PASSWORD: operator
      DJANGO_SUPERUSER_EMAIL: operator@lets-win.local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: >
      sh -c "uv sync &&
             uv run python manage.py migrate --noinput &&
             uv run python manage.py ensure_operator &&
             uv run python manage.py runserver 0.0.0.0:8000"

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_URL: ""
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: >
      sh -c "pnpm install --force &&
             pnpm dev --host 0.0.0.0 --port 5173"

volumes:
  lets_win_pg:
  web_node_modules:
